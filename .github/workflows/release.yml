name: Release

# Push a version tag to cut a release:
#   git tag v1.10.0 && git push origin v1.10.0
# This builds the Linux and Windows targets with the tag baked in as the version and
# publishes them as a GitHub release. Asset names are load-bearing — the
# in-app self-update fetches these exact names (selfUpdateAsset in helpers.go),
# and an already-installed binary looks for the name it was built to expect, so
# a name can be added but never renamed.
# macOS is distributed from tagged source through Homebrew, not release assets.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
      # Build provenance. attest-build-provenance signs with a short-lived
      # certificate minted from the job's OIDC identity — no key material is
      # stored anywhere, and nothing to leak or rotate. id-token mints it,
      # attestations writes the signed statement to this repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release binaries
        # `-s -w` strips the symbol table and DWARF debug info, cutting
        # ~30% off each release binary with no functional change. Local
        # `go build .` (used during development) does NOT pass these flags
        # so `dlv` and rich panic stack traces stay available there.
        #
        # `-trimpath` removes the builder's filesystem paths from the binary,
        # which is what makes the build reproducible: anyone with the tag and
        # the Go version from go.mod can rebuild and compare hashes against
        # SHA256SUMS. That check is worth more than the checksums alone —
        # those only prove the download matches what this workflow published,
        # not that what it published matches this source.
        env:
          LDFLAGS: -s -w -X main.appVersion=${{ github.ref_name }}
          CGO_ENABLED: 0
        run: |
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o tjek .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o tjek-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o tjek.exe .

      # tjek was called taskr, and an install from then updates itself by
      # fetching the asset with its own name (selfUpdateAsset in the build it
      # runs). The same bytes under those names let it update into tjek, which
      # then renames itself on its first run (adoptFormerName).
      - name: Assets under the former names
        run: |
          cp tjek taskr
          cp tjek-linux-arm64 taskr-linux-arm64
          cp tjek.exe taskr.exe

      # Lets anyone verify a download, and gives packagers something to pin.
      # The former names are in it because an old install verifies its
      # download against its own name's line.
      - name: Checksums
        run: sha256sum tjek tjek-linux-arm64 tjek.exe taskr taskr-linux-arm64 taskr.exe > SHA256SUMS

      # SHA256SUMS proves a download matches what this workflow published. It
      # cannot prove anything about the publisher, because it is published by
      # the same account as the binaries it describes — anyone who can edit the
      # release can edit the sums with it. The attestation is the part that
      # closes that: a signed statement, recorded in a public transparency log,
      # that these exact bytes came out of this workflow at this commit. It is
      # what makes `gh attestation verify` meaningful, and it is the strongest
      # promise the binary downloads can carry, since a signature that lives
      # next to the artifact would only ever be as trustworthy as the release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: tjek, tjek-linux-arm64, tjek.exe

      # The Scoop manifest pins a version and a checksum, so a copy kept by
      # hand in the tree is stale the moment the next tag is pushed, and stale
      # in the checksum, which is the part users trust. Generating it here from
      # the binaries just built makes it correct by construction. It ships as
      # a release asset so
      # `scoop install .../releases/latest/download/tjek.json` always points
      # at the newest release without anything to bump.
      # taskr.json is the same manifest under the name a Scoop install made
      # before the rename fetches on `scoop update`; it installs tjek.
      - name: Package manifests
        run: |
          packaging/generate-packages.sh "${{ github.ref_name }}" .
          cp tjek.json taskr.json

      # The release body is this tag's CHANGELOG section, so the release page
      # says what changed in the words it was written in rather than listing
      # commit subjects. A tag with no section — a hotfix cut before the entry
      # is written — falls back to generated notes instead of publishing an
      # empty body.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ github.ref_name }}
        run: |
          assets=(tjek tjek-linux-arm64 tjek.exe SHA256SUMS tjek.json taskr taskr-linux-arm64 taskr.exe taskr.json)
          if packaging/release-notes.sh "$V" CHANGELOG.md > "$RUNNER_TEMP/notes.md"; then
            gh release create "$V" --title "$V" --notes-file "$RUNNER_TEMP/notes.md" "${assets[@]}"
          else
            echo "::warning::no CHANGELOG section for $V — falling back to generated notes"
            gh release create "$V" --title "$V" --generate-notes "${assets[@]}"
          fi

  # macOS installs build from the tagged source through the Iliorn/homebrew-tap
  # formula, which pins the tag's tarball and its checksum. Bumping both here
  # means a release is finished when its tag is pushed. The workflow token
  # cannot write to another repository, so the tap takes a deploy key scoped
  # to that one repository (secret HOMEBREW_TAP_DEPLOY_KEY) rather than a
  # personal token that could write to all of them.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Bump the Homebrew formula
        env:
          V: ${{ github.ref_name }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          url="https://github.com/Morteningemann86/xtratjek/archive/refs/tags/${V}.tar.gz"
          sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:Iliorn/homebrew-tap.git tap
          cd tap
          sed -i -E \
            -e "s|^(  url \")[^\"]*(\")$|\1${url}\2|" \
            -e "s|^(  sha256 \")[^\"]*(\")$|\1${sha}\2|" \
            Formula/tjek.rb
          if git diff --quiet; then
            echo "Formula/tjek.rb already points at ${V}"
            exit 0
          fi
          git diff
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "tjek ${V}"
          git push origin HEAD
