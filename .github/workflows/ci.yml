name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The matrix is the platforms tjek actually ships: the release attaches a
  # Linux and a Windows binary, and macOS installs from tagged source through
  # the Homebrew tap. Testing only on Linux meant the Windows binary was first
  # compiled by the release job — after the tag existed — and its
  # platform-specific paths (editor resolution, the notepad fallback, the
  # self-update file ops) were never run at all.
  test:
    strategy:
      fail-fast: false # one platform failing should not hide the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      # -timeout is below Go's 10m default on purpose: a test that hangs on
      # one platform should dump every goroutine's stack while the job still
      # has time to report it. Without it a Windows stall is indistinguishable
      # from a runner that stopped making progress, and the job just sits there.
      #
      # -shuffle=on because the suite leans on process-wide state — the theme,
      # the language, the keymap overlay, the board stages, the store
      # singleton, the persisted undo stack — and a test that inherits one of
      # those from whoever ran before it passes in source order and nowhere
      # else. That is not hypothetical: turning this on found four tests
      # asserting against another test's leftovers. The seed is printed on
      # failure; reproduce with `go test -shuffle=<seed>`.
      - name: Test
        run: go test -shuffle=on -timeout 5m ./...
      # The app runs a sync hub, an SSE listener, a filesystem watcher and async
      # saves, so the goroutine surface is wide enough that a data race is a
      # question of when. The suite is race-clean today; -race keeps it that way.
      # Deliberately *not* shuffled: when both jobs are red, the pair says which
      # of the two — ordering or concurrency — actually broke.
      - name: Test (race)
        run: go test -race -timeout 10m ./...
      - name: Build
        run: go build .

  # Cross-compiles every shipped target from one runner, so a build break in a
  # GOOS-gated path is caught even when a matrix runner is unavailable or
  # queued. The first two are exactly what the release job attaches; the darwin
  # pair is what Homebrew builds from source on both Apple architectures.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cross-compile release targets
        run: |
          GOOS=linux   GOARCH=amd64 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null .
          GOOS=darwin  GOARCH=amd64 go build -o /dev/null .

  # The parsers take free-form user text (quick-add, search, dates, time
  # entries) and hand back structs the rest of the app trusts. The seed
  # corpus already runs as ordinary unit tests in the `test` job; this job
  # spends a bounded amount of time actually mutating, so the fuzz targets
  # keep finding things instead of quietly rotting into seed-only tests.
  # Failures write the crasher to testdata/fuzz/ — commit it with the fix.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fuzz the parsers
        run: |
          # A finding and a flake fail the same way to `go test`, so tell them
          # apart by what Go leaves behind: a real crasher is written to
          # testdata/fuzz/ and announced as "Failing input written to". A run
          # that ends in "context deadline exceeded" at the -fuzztime boundary
          # wrote nothing — that is the coordinator failing to stop its workers
          # in time on a loaded runner, and it has nothing to do with the
          # parser. Retry those once; fail immediately on a real one, so a
          # crasher is never retried into looking intermittent.
          run_target() {
            local target="$1" out status=0
            out=$(go test -run="$target" -fuzz="$target" -fuzztime=30s . 2>&1) || status=$?
            printf '%s\n' "$out"
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if printf '%s' "$out" | grep -q 'Failing input written to'; then
              echo "::error::$target found a crasher — commit its testdata/fuzz entry with the fix"
              return 1
            fi
            return 2
          }
          for target in FuzzParseQuickAdd FuzzParseDueDate FuzzCompileSearch \
                        FuzzParseEntryEdit FuzzParseManualEntry FuzzParseClockOn; do
            echo "::group::$target"
            run_target "$target" && { echo "::endgroup::"; continue; }
            if [ $? -eq 1 ]; then
              echo "::endgroup::"
              exit 1
            fi
            echo "::warning::$target failed without writing a crasher; retrying once"
            run_target "$target" || { echo "::endgroup::"; exit 1; }
            echo "::endgroup::"
          done

  # Dependency CVEs. Dependabot opens PRs when a newer version exists; that is
  # a different question from "does a version we ship have a known
  # vulnerability, and do we call it". govulncheck answers the second one, and
  # it answers it about reachable code — the first run against this tree found
  # a vulnerability in a required module that no tjek code path calls, which
  # is exactly the distinction that keeps this from becoming noise to ignore.
  # A pure-Go SQLite driver and an HTTP sync server are the parts where the
  # difference stops being academic.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Pinned, not @latest: govulncheck's own go.mod tracks the newest Go,
      # and with GOTOOLCHAIN=local an @latest install stops compiling the day
      # it moves past the Go in go.mod — v1.8.0 needs 1.26, and the job went
      # red on a release nobody here made. Bump this with the go directive.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  # Coverage floors, not a coverage target. The point is not to chase a number
  # — it is that the three packages carry deliberately different risk, and a
  # change that quietly drops one of them below where it has been sitting
  # should have to say so out loud. tasksync and todo are the packages where a
  # bug loses tasks rather than mis-renders them, which is why their floors are
  # high; the root package carries the TUI and the CLI and sits lower on
  # purpose. Raise a floor when the real number has moved up and stayed there.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Per-package coverage floors
        run: |
          # pipefail so a test failure here is not swallowed by tee.
          set -o pipefail
          declare -A floor=(
            ["github.com/Morteningemann86/xtratjek"]=78
            ["github.com/Morteningemann86/xtratjek/tasksync"]=92
            ["github.com/Morteningemann86/xtratjek/todo"]=96
          )
          go test -cover -timeout 5m ./... | tee /tmp/cover.txt
          rc=0
          for pkg in "${!floor[@]}"; do
            pct=$(awk -v p="$pkg" '$2 == p { for (i = 1; i <= NF; i++) if ($i ~ /%$/) { sub(/%/, "", $i); print $i } }' /tmp/cover.txt)
            if [ -z "$pct" ]; then
              echo "::error::no coverage reported for $pkg"
              rc=1
              continue
            fi
            if awk -v got="$pct" -v want="${floor[$pkg]}" 'BEGIN { exit !(got < want) }'; then
              echo "::error::$pkg coverage $pct% is below the ${floor[$pkg]}% floor"
              rc=1
            else
              echo "$pkg: $pct% (floor ${floor[$pkg]}%)"
            fi
          done
          exit $rc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...
